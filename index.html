<style>

:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{
  --bg:#100F1A; --surface:#1A1928; --ink:#EEEDF7; --muted:#9C9AB8; --line:#2C2A40;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.inner{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .inner{padding-block:16px 12px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:clamp(24px,5.5vw,34px);line-height:1;margin:0;letter-spacing:-.02em}

.search{position:relative}

.clear:hover{background:var(--soft)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}

.seg{display:flex;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg{overflow-x:auto;scrollbar-width:none}

.title{font-weight:600;font-size:15px;line-height:1.25}
.artist-link{border:0;background:none;padding:0;font:inherit;font-size:13px;color:var(--accent);cursor:pointer;text-align:left;font-weight:500}
.artist-link:hover{text-decoration:underline}
.lyric{font-size:13px;color:var(--muted);font-style:italic;margin-top:2px}

.foot{font-size:12px;color:var(--muted)}

const $=s=>document.querySelector(s);
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const IDX=DATA.map(r=>({c:r[0],a:r[1],t:r[2],l:r[3],o:r[4],na:norm(r[1]),nt:norm(r[2]),nl:norm(r[3]),nc:r[0].toLowerCase()}));
let field="all", origin="all", artistFilter=null, shown=60, last=[];
const inOrigin=r=>origin==="all"||String(r.o)===origin;

function updateTotal(){const rs=IDX.filter(inOrigin);$("#total").textContent=`${rs.length.toLocaleString("pt-BR")} músicas · ${new Set(rs.map(r=>r.a)).size.toLocaleString("pt-BR")} cantores`}

/* sugestões: cantores com mais faixas */
function buildCloud(){
  const cnt={};IDX.filter(inOrigin).forEach(r=>cnt[r.a]=(cnt[r.a]||0)+1);
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,24);
  const box=$("#cloud");box.replaceChildren();
  top.forEach(([a,n])=>{const b=document.createElement("button");b.type="button";b.append(a);const s=document.createElement("small");s.textContent=n;b.append(s);b.onclick=()=>pickArtist(a);box.append(b)});
}

function score(r,terms){
  // todos os termos precisam aparecer no(s) campo(s) escolhido(s)
  const hay = field==="artist"?r.na: field==="title"?r.nt: field==="lyric"?r.nl: field==="code"?r.nc: r.na+" | "+r.nt+" | "+r.nl+" | "+r.nc;
  for(const t of terms) if(!hay.includes(t)) return -1;
  let s=0;const q=terms.join(" ");
  if(r.nc===q) s+=100;
  if(r.nt===q) s+=60; else if(r.nt.startsWith(q)) s+=35; else if(r.nt.includes(q)) s+=20;
  if(r.na===q) s+=50; else if(r.na.startsWith(q)) s+=30; else if(r.na.includes(q)) s+=15;
  if(r.nl.includes(q)) s+=5;
  return s;
}
function run(){
  const raw=$("#q").value; $("#clear").hidden=!raw && !artistFilter;
  const terms=(field==="code"?raw.toLowerCase().trim().split(/\s+/):norm(raw).split(" ")).filter(Boolean);
  let rows=IDX.filter(r=>inOrigin(r)&&(!artistFilter||r.a===artistFilter));
  if(terms.length){
    rows=rows.map(r=>[score(r,terms),r]).filter(x=>x[0]>=0).sort((a,b)=>b[0]-a[0]||a[1].a.localeCompare(b[1].a)||a[1].t.localeCompare(b[1].t)).map(x=>x[1]);
  } else if(artistFilter){
    rows=[...rows].sort((a,b)=>a.t.localeCompare(b.t));
  } else rows=null;
  last=rows||[]; shown=60; render(terms);
}
function hl(text,terms){
  const frag=document.createDocumentFragment();
  if(!terms.length){frag.append(text);return frag}
  const n=norm2(text);let marks=[];
  for(const t of terms){let i=n.indexOf(t);while(i>-1){marks.push([i,i+t.length]);i=n.indexOf(t,i+t.length)}}
  marks.sort((a,b)=>a[0]-b[0]);let pos=0;
  for(const [s,e] of marks){if(s<pos)continue;frag.append(text.slice(pos,s));const m=document.createElement("mark");m.textContent=text.slice(s,e);frag.append(m);pos=e}
  frag.append(text.slice(pos));return frag;
}
// normaliza mantendo o mesmo comprimento para posicionar o destaque
function norm2(s){return [...s].map(ch=>{const b=ch.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();return b.length===1&&/[a-z0-9]/.test(b)?b:" "}).join("")}

  }

  if(!last.length){const e=document.createElement("div");e.className="empty";e.textContent=field==="all"?"Nada encontrado. Confira a grafia ou tente só uma palavra do nome.":"Nada encontrado nesse campo. Tente buscar em “Tudo”.";out.append(e);return}

  });
  out.append(ol);
  if(last.length>shown){const m=document.createElement("button");m.type="button";m.className="more";m.textContent=`Mostrar mais (${(last.length-shown).toLocaleString("pt-BR")} restantes)`;m.onclick=()=>{shown+=100;render(terms)};const w=document.createElement("div");w.style.display="flex";w.style.justifyContent="center";w.style.marginTop="12px";w.append(m);out.append(w)}
}
function copy(text,el){
  const done=()=>{el.classList.add("ok");setTimeout(()=>el.classList.remove("ok"),1200)};
  try{navigator.clipboard.writeText(text).then(done,()=>{sel(el);done()})}catch{sel(el);done()}
}
function sel(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function pickArtist(a){artistFilter=a;$("#q").value="";window.scrollTo({top:0});run()}

let tm;$("#q").addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(run,120)});
$("#clear").onclick=()=>{$("#q").value="";artistFilter=null;run();$("#q").focus()};
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{field=c.dataset.f;document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===c));$("#q").placeholder=c.dataset.f==="code"?"Digite o código (ex.: 1039 ou D21-02)":"Busque cantor, música, trecho ou código";run()});
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{origin=b.dataset.o;document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));artistFilter=null;updateTotal();buildCloud();run()});
updateTotal();buildCloud();run();
